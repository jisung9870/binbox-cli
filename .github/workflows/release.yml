name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build reproducible release archives
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION="${VERSION#v}"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export VERSION SOURCE_DATE_EPOCH
          scripts/release.sh
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          artifact-name: bb-sbom
          output-file: dist/bb.spdx.json
          format: spdx-json
      - name: Publish checksums, archives, and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then TAG="v${INPUT_VERSION}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt dist/*.spdx.json --clobber
          else
            PRERELEASE_FLAG=""
            case "$TAG" in *-*) PRERELEASE_FLAG="--prerelease";; esac
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt dist/*.spdx.json \
              --target "$GITHUB_SHA" --generate-notes $PRERELEASE_FLAG
          fi
      - name: Attest release artifacts
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
